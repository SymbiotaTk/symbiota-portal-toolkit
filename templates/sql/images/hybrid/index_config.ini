; ============================================================================
; Hybrid Index Configuration for Images Module
; ============================================================================
; This file defines which fields to index in the HYBRID cache.
;
; HYBRID INDEX STRATEGY:
; - Index ONLY low-cardinality fields (< 10K unique values) in SQLite
; - Query high-cardinality fields directly from MySQL
; - Optimized for 6M+ image datasets
;
; LOW-CARDINALITY FIELDS (indexed in SQLite):
;   - Taxonomy: family, genus (< 5K unique values)
;   - Geography: country, stateProvince, county (< 7K unique values)
;   - Collections: collectionCode, institutionCode, collectionName (< 100 values)
;
; HIGH-CARDINALITY FIELDS (query MySQL directly):
;   - sciname, scientificName (50K-80K unique values)
;   - catalogNumber (nearly unique per specimen)
;   - otherCatalogNumbers (millions of tokens)
;   - locality (millions of tokens)
;   - municipality (thousands of unique values)
;   - eventDate (thousands of unique dates)
;
; This reduces hybrid index size from 6GB to ~200MB while maintaining
; fast autocomplete and search for common fields.
; ============================================================================

; Root entity table (the primary table that defines entities)
[_config]
root_table = media
root_id_column = mediaID

; Global WHERE clause applied to root table query
where_clause = "occid IS NOT NULL"

; ============================================================================
; Table: media (root entity)
; ============================================================================
[media]
primary_key = "mediaID"
foreign_key[] = "occid:omoccurrences.occid"

; Display-only columns (stored in Entities table, NOT indexed)
columns[] = url:text:display
columns[] = originalUrl:text:display
columns[] = thumbnailUrl:text:display

; Root entity ID
columns[] = mediaID:numeric:root

; Foreign key columns
columns[] = occid:numeric:fk

; ============================================================================
; Table: omoccurrences
; ============================================================================
[omoccurrences]
primary_key = "occid"
foreign_key[] = "collid:omcollections.collID"
foreign_key[] = "tidInterpreted:taxa.tid"

; LOW-CARDINALITY INDEXED FIELDS (< 10K unique values)
; These are indexed in SQLite for fast autocomplete and search
columns[] = family:text:whole
columns[] = genus:text:whole
; columns[] = sciname:text:whole                -- EXCLUDED (82K values - too high cardinality)
columns[] = country:text:whole
columns[] = stateProvince:text:whole
columns[] = county:text:whole

; NUMERIC FIELDS (indexed for range queries)
columns[] = occid:numeric
columns[] = collid:numeric
columns[] = tidInterpreted:numeric
columns[] = decimalLatitude:numeric
columns[] = decimalLongitude:numeric

; HIGH-CARDINALITY FIELDS - NOT INDEXED (query MySQL directly)
; These fields are excluded from the hybrid index to reduce size
; They will be queried directly from MySQL when needed
; columns[] = catalogNumber:text:whole          -- EXCLUDED (nearly unique)
; columns[] = otherCatalogNumbers:text:split    -- EXCLUDED (millions of tokens)
; columns[] = locality:text:split               -- EXCLUDED (millions of tokens)
; columns[] = municipality:text:whole           -- EXCLUDED (thousands of values)
; columns[] = eventDate:date:whole              -- EXCLUDED (thousands of dates)
; columns[] = scientificName:text:whole         -- EXCLUDED (duplicate of sciname)
; columns[] = continent:text:whole              -- EXCLUDED (low value, use country)
; columns[] = dateLastModified:date:whole       -- EXCLUDED (not user-facing)

; ============================================================================
; Table: omcollections (processed via DISTINCT collid values)
; ============================================================================
[omcollections]
primary_key = "collID"

; LOW-CARDINALITY INDEXED FIELDS (< 100 unique values)
columns[] = collectionName:text:whole
columns[] = collectionCode:text:whole
columns[] = institutionCode:text:whole

; ============================================================================
; Table: taxa (processed via DISTINCT tidInterpreted values)
; ============================================================================
[taxa]
primary_key = "tid"

; LOW-CARDINALITY INDEXED FIELDS
; Note: We already index family, genus from omoccurrences
; sciName excluded due to high cardinality (57K values)
; columns[] = sciName:text:whole                -- EXCLUDED (57K values - too high cardinality)

; ============================================================================
; Field Aliases
; ============================================================================
; Multi-Field Aliases (handled in SearchQueryParser::resolveMultiFieldAlias()):
;   collection  → collectionName OR collectionCode OR institutionCode
;   location    → country OR stateProvince OR county OR municipality OR locality
;   place       → country OR stateProvince OR county OR municipality OR locality
;   geography   → country OR stateProvince OR county OR municipality OR locality
;   taxon       → sciname OR scientificName OR sciName (scientific/species name)
;                 Note: In hybrid mode, sciname is NOT indexed (high cardinality)
;                 Queries will fall back to MySQL for sciname searches
;   taxonomy    → family OR genus OR scientificName OR sciname (all taxonomic fields)
;
; Single-Field Aliases (for autocomplete field suggestions):
;   These aliases appear in autocomplete dropdown even though the target fields
;   are not indexed in hybrid mode. Searches will fall back to MySQL.
; ============================================================================
[aliases]
; Date/Time - alternative names for eventDate
; Note: eventDate is NOT indexed in hybrid cache - queries go to MySQL
date = eventDate

; Geography - alternative names
state = stateProvince

; Taxonomy - aliases for autocomplete field suggestions
; These appear in autocomplete dropdown and trigger multi-field searches via SearchQueryParser
; Note: In hybrid mode, sciname/scientificName are NOT indexed (82K values - high cardinality)
; Searches will automatically fall back to MySQL for these fields
taxon = sciname
sciname = sciname
scientificName = scientificName

; Collection - alternative names
; Note: catalogNumber is NOT indexed in hybrid cache - queries go to MySQL
catalog = catalogNumber

