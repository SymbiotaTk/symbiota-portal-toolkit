; ============================================================================
; Flat Index Configuration for Images Module
; ============================================================================
; This file defines the FLAT index structure using normalized tables.
;
; FLAT INDEX STRATEGY (Option B - Normalized with Indexes):
; - Copy source.db tables (media, omoccurrences, omcollections, taxa) into flat_index.db
; - Add comprehensive indexes on all searchable fields
; - Add autocomplete tables for fast web interface
; - Use JOINs with indexed tables (fast with proper indexes)
; - No data duplication (same size as source.db ~3.1GB)
;
; TABLES IN FLAT INDEX:
;   - media (6M rows) - indexed on occid
;   - omoccurrences (4M rows) - indexed on occid, collid, tidinterpreted, all search fields
;   - omcollections (96 rows) - indexed on collid
;   - taxa (167K rows) - indexed on tid, sciname
;   - AutocompleteTaxon - for taxon autocomplete
;   - AutocompleteLocation - for location autocomplete
;   - AutocompleteCollection - for collection autocomplete
;
; TAXONOMY SEARCH (taxon: searches 3 sciname fields + family + genus):
;   - omoccurrences.sciname (original determination)
;   - omoccurrences.scientificname (current determination)
;   - taxa.sciname (via tidinterpreted → tid)
;   - omoccurrences.family
;   - omoccurrences.genus
;
; This provides maximum search performance (sub-second for 6M records)
; with minimal database size (no duplication, just indexes).
; ============================================================================

; Root entity configuration
[_config]
root_table = media
root_id_column = mediaID

; Global WHERE clause applied to root table query
where_clause = "occid IS NOT NULL"

; ============================================================================
; Tables to Copy from source.db
; ============================================================================
; These tables will be copied from source.db into flat_index.db
; ============================================================================

[tables]
; Core tables to copy
tables[] = media
tables[] = omoccurrences
tables[] = omcollections
tables[] = taxa

; ============================================================================
; Indexes to Create
; ============================================================================
; These indexes will be created on the copied tables for fast search.
; Format: table.column or table.column:type
; ============================================================================

[indexes]
; Media table indexes
indexes[] = media.occid
indexes[] = media.mediaID

; Omoccurrences table indexes (primary search fields)
indexes[] = omoccurrences.occid
indexes[] = omoccurrences.collid
indexes[] = omoccurrences.tidinterpreted

; Taxonomy indexes (for taxon: search)
indexes[] = omoccurrences.family:nocase
indexes[] = omoccurrences.genus:nocase
indexes[] = omoccurrences.sciname:nocase
indexes[] = omoccurrences.scientificname:nocase

; Geography indexes
indexes[] = omoccurrences.country:nocase
indexes[] = omoccurrences.stateProvince:nocase
indexes[] = omoccurrences.county:nocase
indexes[] = omoccurrences.locality:nocase

; Identifier indexes
indexes[] = omoccurrences.catalogNumber:nocase

; Collection table indexes
indexes[] = omcollections.collid
indexes[] = omcollections.collectionCode:nocase
indexes[] = omcollections.institutionCode:nocase

; Taxa table indexes
indexes[] = taxa.tid
indexes[] = taxa.sciname:nocase

; ============================================================================
; Table Relationships (JOIN Definitions)
; ============================================================================
; Defines how tables are related for JOIN operations.
; Format: relationship_name = "table1.column = table2.column"
; ============================================================================

[table_relationships]
; Primary relationships
media_to_occurrences = "media.occid = omoccurrences.occid"
occurrences_to_collections = "omoccurrences.collid = omcollections.collid"
occurrences_to_taxa = "omoccurrences.tidinterpreted = taxa.tid"

; ============================================================================
; Table Aliases (SQL Aliases)
; ============================================================================
; Defines short aliases used in SQL queries for readability.
; Format: table_name = alias
; ============================================================================

[table_aliases]
media = m
omoccurrences = o
omcollections = c
taxa = t

; ============================================================================
; Autocomplete Configuration
; ============================================================================
; Autocomplete tables provide fast typeahead suggestions for web interface.
; These are built from DISTINCT values in the indexed tables.
; ============================================================================

[autocomplete]
; Enable autocomplete cache
; Default: true (always build autocomplete for web interface)
enabled = true

; Autocomplete cache tables to build
; Note: taxon autocomplete now uses TaxonTokens (inverted index table)
tables[] = collection
tables[] = location
tables[] = catalog

; ============================================================================
; Inverted Index Configuration (Triple Store Concept)
; ============================================================================
; The inverted index provides fast multi-field searches by tokenizing
; distinct values and creating occid→token mappings.
;
; THREE INVERTED INDEXES:
; 1. TaxonTokens + OccurrenceTaxonIndex (family, genus, sciname, scientificname, taxa.sciname)
; 2. LocationTokens + OccurrenceLocationIndex (country, stateProvince, county, locality)
; 3. CollectionTokens + OccurrenceCollectionIndex (catalogNumber, collectionCode, institutionCode, collectionName)
;
; This enables fast keyword searches by searching all three token tables
; and combining the results via UNION of occid sets.
; ============================================================================

[inverted_index.taxon]
; Enable inverted index for taxon searches
enabled = true

; Token table configuration
token_table = TaxonTokens
token_id_column = token_id
token_value_column = taxon_value
token_count_column = count

; Inverted index table configuration
index_table = OccurrenceTaxonIndex
index_occid_column = occid
index_token_column = token_id

; Fields to include in inverted index (from omoccurrences and taxa tables)
source_fields[] = omoccurrences.family
source_fields[] = omoccurrences.genus
source_fields[] = omoccurrences.sciname
source_fields[] = omoccurrences.scientificname
source_fields[] = taxa.sciname

[inverted_index.location]
; Enable inverted index for location searches
enabled = true

; Token table configuration
token_table = LocationTokens
token_id_column = token_id
token_value_column = location_value
token_count_column = count

; Inverted index table configuration
index_table = OccurrenceLocationIndex
index_occid_column = occid
index_token_column = token_id

; Fields to include in inverted index (from omoccurrences table)
source_fields[] = omoccurrences.country
source_fields[] = omoccurrences.stateProvince
source_fields[] = omoccurrences.county
source_fields[] = omoccurrences.locality

[inverted_index.collection]
; Enable inverted index for collection searches
; OPTIMIZED: Uses collid lookup instead of text tokenization
; This avoids duplicating collection data for every occurrence
enabled = true

; Collection lookup table (stores unique collections)
; This is a small table (~100-1000 rows) that stores each collection once
lookup_table = CollectionLookup
lookup_id_column = collid
lookup_name_column = collectionName
lookup_code_column = collectionCode
lookup_institution_column = institutionCode

; Inverted index table (maps occid -> collid)
; This is much smaller than token-based approach (one row per occurrence, not per token)
index_table = OccurrenceCollectionIndex
index_occid_column = occid
index_collid_column = collid

; Legacy token table configuration (for backward compatibility with existing autocomplete)
; TODO: Migrate autocomplete to use CollectionLookup instead
token_table = CollectionTokens
token_id_column = token_id
token_value_column = collection_value
token_count_column = count

; Fields to include in inverted index (from omoccurrences and omcollections tables)
source_fields[] = omoccurrences.catalogNumber
source_fields[] = omcollections.collectionCode
source_fields[] = omcollections.institutionCode
source_fields[] = omcollections.collectionName

; Taxon autocomplete (uses TaxonTokens inverted index table)
[autocomplete.taxon]
table_name = TaxonTokens
value_column = taxon_value
count_column = count
min_length = 2

; Location autocomplete (uses LocationTokens inverted index table)
[autocomplete.location]
table_name = LocationTokens
value_column = location_value
count_column = count
min_length = 2

; Collection autocomplete (uses CollectionTokens inverted index table)
[autocomplete.collection]
table_name = CollectionTokens
value_column = collection_value
count_column = count
min_length = 2

; Catalog autocomplete (uses CollectionTokens inverted index table)
[autocomplete.catalog]
table_name = CollectionTokens
value_column = collection_value
count_column = count
min_length = 1

; ============================================================================
; Field Aliases, Keyword Search, and Exclusion Filters
; ============================================================================
; KEYWORD SEARCH (configurable in config.php):
;   Default keyword: 'q' (configurable via [mod.images] search_keyword = "q")
;   Usage: q:backyard OR just 'backyard' (without field:value syntax)
;   Searches ALL indexed fields defined in [indexes] section
;   Prevents conflicts with actual database column names
;
; EXCLUSION FILTERS (exclude matching records):
;   Syntax: !:field:value OR !field:value
;   Uses NOT LIKE operator to exclude matches
;   Can be combined with AND/OR logic
;
; Multi-Field Aliases (search across multiple fields with OR logic):
;   taxon       → family OR genus OR sciname OR scientificname OR taxa.sciname
;   collection  → collectionName OR collectionCode OR institutionCode
;   location    → country OR stateProvince OR county OR locality
;
; Single-Field Aliases (alternative names for fields):
;   state       → stateProvince
;   catalog     → catalogNumber
;
; EXAMPLES:
;   backyard                                    → keyword search (all indexed fields)
;   q:backyard                                  → explicit keyword search (same as above)
;   family:Russulaceae                          → specific field search
;   taxon:Russula                               → multi-field alias (searches 5 taxon fields)
;   family:Russulaceae !:genus:Lactarius        → Russulaceae excluding Lactarius
;   family:Russulaceae !genus:Lactarius         → same as above (shorthand)
;   q:mushroom !:stateProvince:California       → mushrooms excluding California
; ============================================================================

[aliases]
; Multi-field aliases (handled by resolveFieldAlias())
; These are defined in code, not here

; Single-field aliases (alternative names)
state = stateProvince
catalog = catalogNumber
sciname = sciname
scientificName = sciname

; ============================================================================
; Performance Tuning
; ============================================================================

[performance]
; SQLite PRAGMA settings for index building
journal_mode = WAL
synchronous = NORMAL
cache_size = 10000

; Batch size for INSERT operations
batch_size = 1000

; Run ANALYZE after index creation
analyze = true

