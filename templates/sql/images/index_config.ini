; ============================================================================
; EAV Index Configuration for Images Module
; ============================================================================
; This file defines which tables and columns to export and convert to EAV.
; The EAV builder uses this configuration to be schema-agnostic.
;
; Table Definition Format:
; [table_name]
; primary_key = "column_name"
; foreign_key[] = "local_column:referenced_table.referenced_column"
; columns[] = column_name:type[:flag][:strategy]
;
; Primary Key:
;   - Identifies the unique identifier for this table
;   - Used for JOIN operations and relationship mapping
;
; Foreign Keys:
;   - Defines relationships to other tables
;   - Format: "local_column:referenced_table.referenced_column"
;   - Meaning: "This table's local_column references referenced_table.referenced_column"
;   - Example: media.foreign_key[] = "occid:omoccurrences.occid"
;     means "media.occid references omoccurrences.occid"
;     generates SQL: LEFT JOIN omoccurrences ON omoccurrences.occid = media.occid
;   - Multiple foreign keys can be defined using foreign_key[]
;   - The EAV builder automatically constructs JOIN paths from root to leaf tables
;
; Column Definition:
;   - type: text, numeric, date
;   - flag: display, fk, root
;   - strategy: whole (default), split
;
; Flags:
;   - :display - Store in Entities table for display/linking (NOT indexed/searchable)
;   - :fk - Foreign key column (used for JOINs only, NOT indexed/searchable)
;   - :root - Root entity ID column (already selected as primary identifier, NOT indexed separately)
;   - (no flag) - Index in EAV table (searchable)
;
; Tokenization strategies (for indexed fields only):
;   - :whole - Keep entire value as single token (default for identifiers, names)
;   - :split - Split text by whitespace (for keyword search in descriptions)
;
; Note: ID fields (occid, collid, tidInterpreted, parenttid) are numeric for
; range searches rather than partial text matching.
; ============================================================================

; Root entity table (the primary table that defines entities)
[_config]
root_table = media
root_id_column = mediaID

; Global WHERE clause applied to root table query
; This filters which root entities are included in the EAV index
; Note: Do NOT use table aliases - use column names directly
where_clause = "occid IS NOT NULL"

; ============================================================================
; Table: media (root entity)
; ============================================================================
[media]
; Primary key
primary_key = "mediaID"

; Foreign keys: media.occid → omoccurrences.occid
foreign_key[] = "occid:omoccurrences.occid"

; Display-only columns (stored in Entities table, NOT indexed)
columns[] = url:text:display
columns[] = originalUrl:text:display
columns[] = thumbnailUrl:text:display

; Root entity ID (already selected as primary identifier, NOT indexed separately)
columns[] = mediaID:numeric:root

; Foreign key columns (used for JOINs only, NOT indexed)
columns[] = occid:numeric:fk

; ============================================================================
; Table: omoccurrences
; ============================================================================
[omoccurrences]
; Primary key
primary_key = "occid"

; Foreign keys: omoccurrences.collid → omcollections.collID, omoccurrences.tidInterpreted → taxa.tid
foreign_key[] = "collid:omcollections.collID"
foreign_key[] = "tidInterpreted:taxa.tid"

; Searchable columns (based on actual TSV schema)
columns[] = occid:numeric
columns[] = catalogNumber:text:whole
columns[] = otherCatalogNumbers:text:split
columns[] = family:text:whole
columns[] = genus:text:whole
columns[] = scientificName:text:whole
columns[] = sciname:text:whole
columns[] = continent:text:whole
columns[] = country:text:whole
columns[] = stateProvince:text:whole
columns[] = county:text:whole
columns[] = municipality:text:whole
columns[] = locality:text:split
columns[] = decimalLatitude:numeric
columns[] = decimalLongitude:numeric
columns[] = eventDate:date:whole
columns[] = dateLastModified:date:whole

; Foreign key columns - INDEXED as numeric IDs for fast exact matching
; Text fields from referenced tables are also indexed via DISTINCT processing
columns[] = collid:numeric
columns[] = tidInterpreted:numeric

; ============================================================================
; Table: omcollections (processed via DISTINCT collid values)
; ============================================================================
[omcollections]
; Primary key
primary_key = "collID"

; Searchable columns - processed ONCE per unique collID (not per entity)
columns[] = collectionName:text:split
columns[] = collectionCode:text:whole
columns[] = institutionCode:text:whole

; ============================================================================
; Table: taxa (processed via DISTINCT tidInterpreted values)
; ============================================================================
[taxa]
; Primary key
primary_key = "tid"

; Searchable columns - processed ONCE per unique tid (not per entity)
columns[] = sciName:text:whole

; ============================================================================
; Table: taxstatus
; ============================================================================
; DISABLED: taxstatus table schema needs to be verified
; [taxstatus]
; ; Note: taxstatus has a composite primary key, but we don't define it here
; ; since we only need the columns for indexing, not for table creation
;
; ; Foreign keys: taxstatus.tid → taxa.tid, taxstatus.parenttid → taxa.tid
; foreign_key[] = "tid:taxa.tid"
; foreign_key[] = "parenttid:taxa.tid"
;
; ; Searchable columns (based on actual TSV schema)
; columns[] = tid:numeric
; columns[] = family:text:whole
; columns[] = parenttid:numeric

; ============================================================================
; Field Aliases
; ============================================================================
; Defines search aliases that map to actual column names in the EAV index.
; Format: alias = actual_column_name
;
; Only define aliases for ALTERNATIVE NAMES that differ from the actual
; attribute name. All attribute names are already searchable (case-insensitive).
;
; Examples:
;   --query="date:1974"  maps to  eventDate column
;   --query="state:Illinois"  maps to  stateProvince column
;   --query="taxon:amanita"  maps to  sciname column
;
; Note: Some aliases have special handling (e.g., 'date' supports operators
; and ranges). See executeEventDateQuery() for details.
;
; Multi-Field Aliases (handled in SearchQueryParser::resolveMultiFieldAlias()):
;   collection  → collectionName OR collectionCode OR institutionCode
;   location    → country OR stateProvince OR county OR municipality OR locality
;   place       → country OR stateProvince OR county OR municipality OR locality
;   geography   → country OR stateProvince OR county OR municipality OR locality
;   taxonomy    → family OR genus OR scientificName OR sciname
; ============================================================================
[aliases]
; Date/Time - alternative names for eventDate
date = eventDate

; Geography - alternative names
state = stateProvince

; Taxonomy - alternative names
; 'taxon' is a user-friendly alias for scientific name
taxon = sciname

; Collection - alternative names
; 'catalog' is shorthand for catalogNumber
catalog = catalogNumber

