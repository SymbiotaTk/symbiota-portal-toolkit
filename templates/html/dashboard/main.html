<!DOCTYPE html>
<html>
<head>
    <title>{title}</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 2rem; }
        h1 { color: #2c3e50; }
        h1 small { color: #7f8c8d; font-weight: normal; }
        ul { list-style-type: none; padding: 0; }
        li { margin: 0.5rem 0; }
        a { color: #3498db; text-decoration: none; padding: 0.5rem 1rem; border: 1px solid #3498db; border-radius: 4px; display: inline-block; }
        a:hover { background-color: #3498db; color: white; }
        .footer { margin-top: 2rem; color: #7f8c8d; font-style: italic; }
    </style>
</head>
<body>
    <a id="top" />
    <h1>{title} <small>v{version}</small></h1>
    <h2>Available Components</h2>
    <ul>
{component_links}
    </ul>
    <div class="footer">
        <p>This is a placeholder dashboard. Component interfaces will be implemented in future tasks.</p>
    </div>
</body>
</html>
