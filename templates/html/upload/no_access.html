<!-- Upload Access Denied Template -->
<div class="upload-no-access">
    <h2>Upload Access Required</h2>
    <div class="user-info">
        <p><strong>User:</strong> {user_display}</p>
        <p><strong>UID:</strong> {uid}</p>
    </div>
    <div class="access-message">
        <div class="alert alert-warning">
            <h4>Access Denied</h4>
            <p>{access_message}</p>
        </div>
        <div class="contact-info">
            <p>To request upload access, please contact your system administrator with your user information shown above.</p>
        </div>
    </div>
    <div class="navigation">
        <a href="{app_url_prefix}" class="btn btn-primary">Return to Dashboard</a>
    </div>
</div>
