<div class="alert alert-danger" role="alert">
    <div class="d-flex align-items-center">
        <i class="fas fa-exclamation-triangle fa-2x me-3"></i>
        <div>
            <h6 class="alert-heading mb-1">Search Error</h6>
            <p class="mb-0">{error_message}</p>
        </div>
    </div>
</div>

<div class="text-center text-muted mt-4">
    <i class="fas fa-search fa-3x mb-3"></i>
    <p>Please check your search criteria and try again</p>
    <small class="text-muted">
        <i class="fas fa-lightbulb me-1"></i>
        <strong>Tips:</strong> Ensure the catalog number exists in the selected collection, 
        or verify the occurrence ID is valid.
    </small>
</div>
