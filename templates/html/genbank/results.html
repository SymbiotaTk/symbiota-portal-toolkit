<div class="results-header mb-3">
    <div class="row align-items-center">
        <div class="col-md-8">
            <h6 class="mb-1">
                <i class="fas fa-building me-1"></i>
                {collection_name}
            </h6>
            <p class="text-muted small mb-0">
                <i class="fas fa-link me-1"></i>
                Occurrence Link: 
                <a href="{occurrence_url}" target="_blank" class="text-decoration-none">
                    {occid}
                    <i class="fas fa-external-link-alt ms-1"></i>
                </a>
            </p>
        </div>
        <div class="col-md-4 text-end">
            <button 
                class="download-btn"
                onclick="downloadTSV('results-table', '{tsv_filename}')"
                title="Download as tab-separated values">
                <i class="fas fa-download"></i>
                Download TSV
            </button>
        </div>
    </div>
</div>

<div class="table-responsive">
    <table id="results-table" class="table table-striped table-hover">
        <thead class="table-dark">
            {table_headers}
        </thead>
        <tbody>
            {table_rows}
        </tbody>
    </table>
</div>

<div class="results-footer mt-3">
    <div class="row">
        <div class="col-md-6">
            <small class="text-muted">
                <i class="fas fa-info-circle me-1"></i>
                Found {record_count} record(s)
            </small>
        </div>
        <div class="col-md-6 text-end">
            <small class="text-muted">
                <i class="fas fa-clock me-1"></i>
                Generated: {timestamp}
            </small>
        </div>
    </div>
</div>
