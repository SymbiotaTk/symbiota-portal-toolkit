<!-- Load Zoom CSS -->
<link rel="stylesheet" href="{app_url_prefix}css/images/zoom.css?v={asset_version}">

<!-- Enhanced Lightbox with Portal Links -->
<div class="image-overlay-lightbox"
     tabindex="0"
     onkeydown="if(event.key === 'Escape') { this.remove(); document.body.style.overflow = ''; }"
     onclick="if(event.target === this) { this.remove(); document.body.style.overflow = ''; }">

    <!-- Close button -->
    <button class="lightbox-close"
            onclick="this.parentElement.remove(); document.body.style.overflow = '';"
            aria-label="Close">
        ×
    </button>

    <!-- Image Container for Zoom -->
    <div class="lightbox-image-container" id="zoom-container">
        <img src="{url}"
             alt="{caption}"
             class="lightbox-image"
             id="zoomable-image"
             loading="eager"
             onerror="handleOverlayImageError(this, '{sciname}', '{occid}', '{collection}')">
    </div>

    <!-- Zoom Controls -->
    <div class="zoom-controls">
        <button type="button" class="zoom-btn" onclick="zoomIn()" aria-label="Zoom In" title="Zoom In">
            <i class="fas fa-search-plus"></i>
        </button>
        <button type="button" class="zoom-btn" onclick="zoomOut()" aria-label="Zoom Out" title="Zoom Out">
            <i class="fas fa-search-minus"></i>
        </button>
        <button type="button" class="zoom-btn" onclick="resetZoom()" aria-label="Reset Zoom" title="Reset Zoom">
            <i class="fas fa-compress-arrows-alt"></i>
        </button>
    </div>

    <!-- Portal Links Overlay -->
    <div class="portal-links-overlay">
        <div class="portal-info-row">
            <span class="sciname">{sciname}</span>
            {tid_link_html}
        </div>
        <div class="portal-info-row">
            <span class="eventdate">{eventdate}</span>
            {occid_link_html}
            <span class="collection">{collection}</span>
            {collid_link_html}
        </div>
        <div class="portal-info-row media-id-row">
            <span class="media-id-label">
                <i class="fas fa-hashtag"></i> Media ID:
            </span>
            <span class="media-id-value" title="Use this ID for carousel curation">{mediaID}</span>
        </div>
    </div>
</div>

<style>
.portal-links-overlay {
    position: absolute;
    bottom: 90px; /* Moved up to make room for zoom controls */
    left: 20px;
    right: 20px;
    background: rgba(0, 0, 0, 0.8);
    color: white;
    padding: 16px 20px;
    border-radius: 8px;
    font-size: 14px;
    line-height: 1.4;
    max-height: 30vh;
    overflow-y: auto;
    z-index: 10000;
}

/* Mobile-specific adjustments */
@media (max-width: 768px) {
    .portal-links-overlay {
        bottom: 80px; /* More space from bottom on mobile */
        left: 10px;
        right: 10px;
        padding: 12px 16px;
        font-size: 13px;
        max-height: 40vh; /* Allow more height on mobile */
    }
}

/* Extra small screens (phones in portrait) */
@media (max-width: 480px) {
    .portal-links-overlay {
        bottom: 90px; /* Even more space on small phones */
        font-size: 12px;
    }
}

.portal-info-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 8px;
}

.portal-info-row:last-child {
    margin-bottom: 0;
}

.media-id-row {
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid rgba(255, 255, 255, 0.2);
    font-size: 12px;
    opacity: 0.85;
}

.media-id-label {
    color: #cbd5e0;
    font-weight: 500;
}

.media-id-label i {
    font-size: 10px;
    opacity: 0.7;
}

.media-id-value {
    font-family: 'Courier New', monospace;
    background: rgba(255, 255, 255, 0.1);
    padding: 2px 8px;
    border-radius: 3px;
    color: #87ceeb;
    cursor: text;
    user-select: all;
}

.sciname {
    font-style: italic;
    font-weight: 500;
    color: #87ceeb;
}

.eventdate {
    color: #98fb98;
    font-weight: 500;
}

.collection {
    color: #ffd700;
    font-weight: 500;
}

.portal-link {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    background: rgba(255, 255, 255, 0.2);
    border-radius: 50%;
    color: white;
    text-decoration: none;
    transition: all 0.2s ease;
    font-size: 12px;
}

.portal-link:hover {
    background: rgba(255, 255, 255, 0.3);
    color: white;
    transform: scale(1.1);
}

.portal-link.occid-link {
    background: rgba(66, 133, 244, 0.6);
}

.portal-link.tid-link {
    background: rgba(52, 168, 83, 0.6);
}

.portal-link.collid-link {
    background: rgba(251, 188, 5, 0.6);
}
</style>

<!-- Load Zoom JavaScript -->
<script src="{app_url_prefix}js/images/zoom.js?v={asset_version}"></script>

<script>
// Focus for keyboard events and prevent body scroll
document.querySelector('.image-overlay-lightbox').focus();
document.body.style.overflow = 'hidden';

// Handle image error in overlay
function handleOverlayImageError(img, sciname, occid, collection) {
    // Create large SVG placeholder for overlay
    const svgPlaceholder = `
        <svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" style="width: 100%; height: auto; background: #1a1a1a;">
            <defs>
                <linearGradient id="overlay-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#2d3748;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#1a202c;stop-opacity:1" />
                </linearGradient>
            </defs>
            <rect width="100%" height="100%" fill="url(#overlay-grad)" stroke="#4a5568" stroke-width="4" stroke-dasharray="10,10"/>

            <!-- Large image icon -->
            <g transform="translate(400, 200)">
                <path d="M-120,-80 L120,-80 L120,80 L-120,80 Z" fill="none" stroke="#718096" stroke-width="6"/>
                <circle cx="-60" cy="-20" r="20" fill="#718096"/>
                <path d="M-120,40 L-40,-20 L40,40 L120,0 L120,80 L-120,80 Z" fill="#4a5568"/>
            </g>

            <!-- Text -->
            <text x="50%" y="55%" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" fill="#e2e8f0" font-weight="bold">
                Image Unavailable
            </text>
            <text x="50%" y="62%" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#a0aec0">
                The image file could not be loaded
            </text>
            <text x="50%" y="68%" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#718096" font-style="italic">
                ${sciname || 'Unknown species'}
            </text>
            ${occid ? `<text x="50%" y="73%" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#718096">Occurrence ID: ${occid}</text>` : ''}
            ${collection ? `<text x="50%" y="78%" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#718096">${collection}</text>` : ''}
            <text x="50%" y="85%" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#4a5568">
                Record details are shown below
            </text>
        </svg>
    `;

    const svgDataUri = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgPlaceholder);
    img.src = svgDataUri;
    img.alt = 'Image unavailable - Record details shown below';
    img.onerror = null; // Prevent infinite loop
}
</script>
