<!-- No Results Message -->
<div class="no-results-container">
    <div class="no-results-icon">
        <i class="fas fa-search"></i>
    </div>
    <h3 class="no-results-title">No Images Found</h3>
    <p class="no-results-message">
        No images match your search: <strong>{query}</strong>
    </p>
    <div class="no-results-suggestions">
        <p><strong>Suggestions:</strong></p>
        <ul>
            <li>Try different search terms or filters</li>
            <li>Check your spelling</li>
            <li>Use broader search criteria (e.g., genus instead of species)</li>
            <li>Try searching by date range or location</li>
        </ul>
    </div>
    <div class="no-results-actions">
        <button type="button" 
                class="btn-clear-search"
                onclick="clearAllFilters(); location.reload();">
            <i class="fas fa-times-circle"></i>
            Clear Search & Browse All Images
        </button>
    </div>
</div>
